name: Update talk show guest calendar

on:
  schedule:
    # GitHub usa UTC. Esto es Lunes 12:00 UTC (aprox 09:00 Argentina UTC-3)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    # Esto hace que TODOS los "run:" se ejecuten dentro de talkshow-guest-calendar
    defaults:
      run:
        shell: bash
        working-directory: talkshow-guest-calendar

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run updater
        run: |
          python update_calendar.py

      - name: Commit updated calendar (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add output/talkshow-guests.ics output/talkshow-guests.json

          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update guest calendar"
          git push
