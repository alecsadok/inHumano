name: Build & Deploy Site (ICS + Eventos) to GitHub Pages

on:
  schedule:
    # Lunes 12:00 UTC (aprox 09:00 Argentina UTC-3)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (repo root)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run updater (talkshow calendar)
        working-directory: talkshow-guest-calendar
        run: |
          python update_calendar.py

      - name: Prepare Pages site (_site)
        run: |
          rm -rf _site
          mkdir -p _site

          # 1) Publicar tu web estática
          cp -r pages/* _site/

          # 2) Publicar el ICS generado
          cp talkshow-guest-calendar/output/talkshow-guests.ics _site/talkshow-guests.ics
          cp talkshow-guest-calendar/output/talkshow-guests.json _site/talkshow-guests.json || true

          # 3) Publicar el proyecto "eventos/"
          mkdir -p _site/eventos
          cp -r eventos/* _site/eventos/

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
