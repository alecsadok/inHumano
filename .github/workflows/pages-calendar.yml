name: Build & Deploy ICS to GitHub Pages

on:
  schedule:
    # Lunes 12:00 UTC (aprox 09:00 Argentina UTC-3)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies (from repo root)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run updater (script is in talkshow-guest-calendar)
        working-directory: talkshow-guest-calendar
        run: |
          python update_calendar.py

      # Arma el “sitio” que se va a publicar en Pages:
      - name: Prepare Pages site (_site)
        run: |
          rm -rf _site
          mkdir -p _site

          # Copiamos tu página estática
          cp -r pages/* _site/

          # Copiamos el output generado por el script
          cp talkshow-guest-calendar/output/talkshow-guests.ics _site/talkshow-guests.ics
          cp talkshow-guest-calendar/output/talkshow-guests.json _site/talkshow-guests.json || true

      # (Opcional pero útil) Mantener “actividad” en el repo:
      # GitHub puede deshabilitar scheduled workflows si no hay actividad 60 días. :contentReference[oaicite:3]{index=3}
      - name: Keep-alive commit (optional)
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > talkshow-guest-calendar/output/last_run_utc.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add talkshow-guest-calendar/output/last_run_utc.txt
          git diff --cached --quiet && exit 0
          git commit -m "Keep alive: update last_run_utc"
          git push

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
