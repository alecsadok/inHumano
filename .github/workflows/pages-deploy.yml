name: Publish inHumano calendars

on:
  push:
    branches:
      - main
    paths:
      - "premios.ics"
      - "talkshow-guest-calendar/output/talkshow-guests.ics"
      - "pages/**"
      - ".github/workflows/pages-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare Pages site
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R pages/. _site/

          if [ -f premios.ics ]; then
            cp premios.ics _site/premios.ics
          else
            printf 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//inHumano//Premios//ES\r\nCALSCALE:GREGORIAN\r\nEND:VCALENDAR\r\n' > _site/premios.ics
          fi

          if [ -f talkshow-guest-calendar/output/talkshow-guests.ics ]; then
            cp talkshow-guest-calendar/output/talkshow-guests.ics _site/talkshow-guests.ics
          else
            printf 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//inHumano//Talkshows//ES\r\nCALSCALE:GREGORIAN\r\nEND:VCALENDAR\r\n' > _site/talkshow-guests.ics
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
