settings:
  days_ahead: 21
  include_sources_in_description: true
  allow_unofficial_fallbacks: true

shows:
  - id: jimmy_kimmel_live
    name: "Jimmy Kimmel Live!"
    country: "US"
    tz_local: "America/New_York"
    airtime_local: "23:35"
    duration_minutes: 60
    sources:
      - type: tvpassport_station
        url: "https://www.tvpassport.com/tv-listings/stations/abc-eastern/1224"
        match:
          contains_any: ["Jimmy Kimmel Live"]
      - type: epguides_show
        url: "https://epguides.com/JimmyKimmelLive/"

  - id: late_show_colbert
    name: "The Late Show with Stephen Colbert"
    country: "US"
    tz_local: "America/New_York"
    airtime_local: "23:35"
    duration_minutes: 60
    sources:
      - type: tvpassport_station
        url: "https://www.tvpassport.com/tv-listings/stations/cbs-eastern/1225"
        match:
          contains_any: ["Late Show With Stephen Colbert", "Late Show with Stephen Colbert"]
      - type: epguides_show
        url: "https://epguides.com/LateShowWithStephenColbert/"

  - id: tonight_show_fallon
    name: "The Tonight Show Starring Jimmy Fallon"
    country: "US"
    tz_local: "America/New_York"
    airtime_local: "23:35"
    duration_minutes: 60
    sources:
      - type: tvpassport_station
        url: "https://www.tvpassport.com/tv-listings/stations/nbc-network-eastern/1227"
        match:
          contains_any: ["Tonight Show Starring Jimmy Fallon", "The Tonight Show Starring Jimmy Fallon"]
      - type: wikipedia_episode_table
        url: "https://en.wikipedia.org/wiki/List_of_The_Tonight_Show_Starring_Jimmy_Fallon_episodes"
        columns:
          date: "Original release date"
          guests: ["Guest(s)", "Musical/entertainment guest(s)"]

  - id: late_night_seth_meyers
    name: "Late Night with Seth Meyers"
    country: "US"
    tz_local: "America/New_York"
    airtime_local: "00:35"
    duration_minutes: 60
    sources:
      - type: tvpassport_station
        url: "https://www.tvpassport.com/tv-listings/stations/nbc-network-eastern/1227"
        match:
          contains_any: ["Late Night With Seth Meyers", "Late Night with Seth Meyers"]
      - type: wikipedia_episode_table
        url: "https://en.wikipedia.org/wiki/List_of_Late_Night_with_Seth_Meyers_episodes"
        columns:
          date: "Original release date"
          guests: ["Guest(s)", "Musical/entertainment guest(s)"]

  - id: snl
    name: "Saturday Night Live"
    country: "US"
    tz_local: "America/New_York"
    airtime_local: "23:30"
    duration_minutes: 90
    sources:
      - type: tvpassport_station
        url: "https://www.tvpassport.com/tv-listings/stations/nbc-network-eastern/1227"
        match:
          contains_any: ["Saturday Night Live"]
      - type: wikipedia_episode_table
        url: "https://en.wikipedia.org/wiki/Saturday_Night_Live_season_51"
        columns:
          date: "Original release date"
          guests: ["Host", "Musical guest"]
