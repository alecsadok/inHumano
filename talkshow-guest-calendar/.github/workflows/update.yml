name: Update talk show guest calendar

on:
  schedule:
    # GitHub usa UTC. Esto corre todos los LUNES 12:00 UTC (aprox 09:00 Argentina, UTC-3)
    - cron: "0 12 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 👇 ESTE paso corre en la RAÍZ del repo (donde está requirements.txt)
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 👇 ESTE paso corre dentro de talkshow-guest-calendar (donde está update_calendar.py)
      - name: Run updater
        working-directory: talkshow-guest-calendar
        run: |
          python update_calendar.py

      # 👇 Commit de los outputs generados dentro de talkshow-guest-calendar/output
      - name: Commit updated calendar (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add talkshow-guest-calendar/output/talkshow-guests.ics talkshow-guest-calendar/output/talkshow-guests.json

          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Update guest calendar"
          git push
