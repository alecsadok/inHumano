name: Update talk show guest calendar

on:
  schedule:
    - cron: "0 12 * * 1"  # Mondays 12:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

- name: Install dependencies
  working-directory: talkshow-guest-calendar
  run: |
    python -m pip install --upgrade pip
    pip install -r requirements.txt

- name: Run updater
  working-directory: talkshow-guest-calendar
  run: |
    python update_calendar.py


      - name: Commit changes (if any)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add talkshow-guest-calendar/output/talkshow-guests.ics talkshow-guest-calendar/output/talkshow-guests.json
          git diff --cached --quiet && exit 0
          git commit -m "Update guest calendar"
          git push
